<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inningz</title>
    <link rel="icon" href="favicon.gif" type="image/gif">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'AnotherDanger';
            src: url('AnotherDanger.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; scroll-snap-type:y mandatory; cursor: url('cursor.png') 16 16, auto; }
        *, *::before, *::after { cursor: url('cursor.png') 16 16, auto !important; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
            letter-spacing: 0.5px;
            cursor: url('cursor.png') 16 16, auto;
        }
        a, button { cursor: url('cursor.png') 16 16, pointer !important; }
        .section {
            min-height:100vh;
            scroll-snap-align:start;
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
            overflow:hidden;
            padding: 40px 20px;
        }
        .bg-video {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            z-index:-2;
            object-fit: cover;
            filter: brightness(0.5) saturate(1.1);
        }
        .bg-overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: linear-gradient(135deg, rgba(42,174,166,0.35), rgba(255,196,144,0.35));
            z-index:-1;
        }
        /* Nav dots - gradient active */
        .nav-dots {
            position: fixed;
            right: 24px;
            top:50%;
            transform: translateY(-50%);
            display:flex;
            flex-direction:column;
            gap:12px;
            z-index:100;
        }
        .nav-dot {
            width:10px; height:10px; border-radius:50%;
            background: rgba(255,255,255,0.25);
            border: none;
            cursor:pointer;
            transition: all 0.3s;
        }
        .nav-dot.active {
            background: linear-gradient(135deg, #2aaea6, #ffc490);
            box-shadow: 0 0 12px rgba(42,174,166,0.6);
            transform: scale(1.4);
        }
        /* Profile - distinct with music */
        .profile-section { flex-direction: column; gap: 18px; min-height:100vh; height:auto; padding:70px 20px 90px 20px; justify-content:flex-start; }
        .pfp-wrap {
            position: relative;
            width: 200px; height: 200px;
            padding: 4px;
            background: linear-gradient(135deg, #2aaea6, #ffc490);
            border-radius: 50%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .pfp {
            width:100%; height:100%;
            border-radius: 50%;
            overflow:hidden;
            background:#111;
        }
        .pfp img { width:100%; height:100%; object-fit:cover; }
        .name {
            font-family:'AnotherDanger', sans-serif;
            font-size: 72px;
            background: linear-gradient(135deg, #2aaea6, #ffc490);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 12px rgba(42,174,166,0.3));
            line-height:1;
        }
        .tagline {
            font-size: 18px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
            margin-top: -6px;
        }
        .social-row {
            display:flex;
            gap:14px;
            margin-top: 12px;
        }
        .social-btn {
            width:46px; height:46px;
            border-radius: 14px;
            display:flex; align-items:center; justify-content:center;
            background: linear-gradient(135deg, #2aaea6, #ffc490);
            border: none;
            color:#000;
            font-size:18px;
            text-decoration:none;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .social-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 24px rgba(42,174,166,0.4); }
        .social-btn svg { width:20px; height:20px; fill: #000; }
        .scroll-hint {
            position:absolute;
            bottom:36px;
            display:flex; flex-direction:column; align-items:center; gap:8px;
            animation: bounce 2s infinite;
        }
        .scroll-hint span { font-size: 11px; letter-spacing:2px; text-transform:uppercase; color: rgba(255,255,255,0.4); }
        .scroll-arrow { width:16px; height:16px; border-right:2px solid rgba(255,255,255,0.4); border-bottom:2px solid rgba(255,255,255,0.4); transform:rotate(45deg); }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(8px)} }

        /* Skills - distinct gradient cards */
        .skills-section { flex-direction: column; gap: 28px; }
        .skills-card {
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(16px);
            border: 2px solid transparent;
            background-clip: padding-box;
            border-radius: 28px;
            padding: 44px 36px 36px 36px;
            width: 640px;
            max-width: 90vw;
            position: relative;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }
        .skills-card::before {
            content:'';
            position:absolute;
            top:0; left:0; right:0; bottom:0;
            border-radius:28px;
            padding:2px;
            background: linear-gradient(135deg, #2aaea6, #ffc490);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events:none;
        }
        .skills-heading {
            font-family:'AnotherDanger', sans-serif;
            font-size: 42px;
            background: linear-gradient(135deg, #2aaea6, #ffc490);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            margin-bottom:6px;
        }
        .skills-sub { font-size:14px; color:rgba(255,255,255,0.5); margin-bottom:32px; letter-spacing:1px; }
        .skills-grid {
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px 36px;
        }
        .skill-label {
            font-size:11px;
            letter-spacing:2px;
            text-transform:uppercase;
            color: rgba(255,255,255,0.45);
            margin-bottom:10px;
        }
        .skill-tags { display:flex; flex-wrap:wrap; gap:8px; }
        .skill-tag {
            padding:7px 14px;
            border-radius:100px;
            font-size:12px;
            background: linear-gradient(135deg, rgba(42,174,166,0.18), rgba(255,196,144,0.18));
            border:1px solid rgba(255,196,144,0.18);
            color:#fff;
        }
        .view-counter-skills {
            position:absolute;
            bottom:14px; right:18px;
            font-size:13px;
            color:rgba(255,255,255,0.85);
            display:flex; align-items:center; gap:6px;
            font-weight:700;
            font-family: 'Inter', sans-serif;
            background: none;
            border: none;
            padding: 0;
        }
        .view-counter-skills .eye { font-size:16px; }
        .view-counter-skills #viewCount { font-family: 'Inter', sans-serif; color:#fff; }

        /* Music - distinct floating gradient player */
        .music-section { flex-direction: column; gap:24px; }
        .music-card {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(18px);
            border-radius: 28px;
            padding:36px;
            width:460px;
            max-width:90vw;
            border:1px solid rgba(255,196,144,0.15);
            box-shadow: 0 10px 36px rgba(0,0,0,0.35);
        }
        .music-header { display:flex; gap:16px; align-items:center; margin-bottom:20px; }
        .music-art { width:64px; height:64px; border-radius:16px; overflow:hidden; flex-shrink:0; border:2px solid transparent; background: linear-gradient(135deg, #2aaea6, #ffc490) border-box; }
        .music-art img { width:100%; height:100%; object-fit:cover; border-radius:14px; }
        .music-title { font-size:17px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .music-artist { font-size:12px; color:rgba(255,255,255,0.55); margin-top:3px; }
        .music-subtitle { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#2aaea6; font-weight:700; }
        .progress-bar2 { width:100%; height:4px; background:rgba(255,255,255,0.12); border-radius:4px; cursor:pointer; overflow:hidden; }
        .progress-fill2 { height:100%; width:0%; background: linear-gradient(90deg, #2aaea6, #ffc490); border-radius:4px; transition: width 0.1s linear; }
        .time-row { display:flex; justify-content:space-between; font-size:11px; color:rgba(255,255,255,0.45); margin-top:8px; font-family: monospace; }
        .music-controls { display:flex; align-items:center; justify-content:center; gap:20px; margin-top:18px; }
        .m-btn { background:none; border:none; color:rgba(255,255,255,0.7); font-size:18px; cursor:pointer; padding:6px; }
        .m-play { width:54px; height:54px; border-radius:50%; background: linear-gradient(135deg, #2aaea6, #ffc490); color:#000; display:flex; align-items:center; justify-content:center; font-size:20px; border:none; cursor:pointer; }
        .vol-wrap { display:flex; align-items:center; gap:6px; }
        .vol-icon2 { background:none; border:none; color:rgba(255,255,255,0.6); cursor:pointer; }
        .vol-slider2 { width:80px; height:4px; -webkit-appearance:none; background:rgba(255,255,255,0.15); border-radius:4px; }
        .vol-slider2::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#ffc490; }

        /* Guestbook - distinct gradient */
        .guest-section { flex-direction:column; gap:24px; padding:60px 20px; }
        .guest-card {
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(16px);
            border-radius:28px;
            padding:32px;
            width:640px;
            max-width:90vw;
            border:1px solid rgba(42,174,166,0.15);
        }
        .guest-heading { font-family:'AnotherDanger', 'Inter', sans-serif; font-size:36px; background: linear-gradient(135deg, #2aaea6, #ffc490); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:6px; }
        .guest-sub { font-size:12px; color:rgba(255,255,255,0.45); margin-bottom:18px; letter-spacing:1px; }
        .guest-form { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
        .g-input { flex:1; min-width:120px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); border-radius:12px; padding:10px 14px; color:#fff !important; outline:none; font-family:'Inter', sans-serif !important; font-size:13px; font-weight:500; -webkit-text-fill-color:#fff !important; }
        .g-input:focus { border-color: rgba(42,174,166,0.6); background:rgba(255,255,255,0.10); }
        .g-input::placeholder { color:rgba(255,255,255,0.35); }
        .g-input.name { max-width:140px; flex:0 0 140px; }
        .g-btn { background: linear-gradient(135deg, #2aaea6, #ffc490); color:#000; border:none; border-radius:12px; padding:10px 18px; font-weight:700; cursor:pointer; font-family:'Inter', sans-serif; }
        .g-meta { display:flex; justify-content:space-between; font-size:11px; color:rgba(255,255,255,0.3); margin-bottom:14px; }
        .guest-wall { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; max-height:210px; overflow-y:auto; padding-right:4px; scrollbar-width:thin; }
        .g-note { background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:12px; position:relative; }
        .g-note.pinned { background: linear-gradient(135deg, rgba(42,174,166,0.18), rgba(255,196,144,0.18)); border-color: rgba(255,196,144,0.25); }
        .g-note-name { font-size:11px; font-weight:700; margin-bottom:6px; }
        .g-note-msg { font-size:12px; color:rgba(255,255,255,0.7); word-break:break-word; }
        .g-note-time { font-size:9px; color:rgba(255,255,255,0.3); margin-top:6px; }
        /* Hover effects */
        .pfp-wrap { transition: transform 0.35s ease, box-shadow 0.35s ease; }
        .pfp-wrap:hover { transform: scale(1.04) rotate(1deg); box-shadow: 0 14px 48px rgba(42,174,166,0.45); }
        .social-btn { transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s; }
        .social-btn:hover { transform: translateY(-4px) scale(1.08); box-shadow: 0 10px 28px rgba(42,174,166,0.5); filter: brightness(1.08); }
        .skill-tag { transition: all 0.25s ease; }
        .skill-tag:hover { transform: translateY(-2px) scale(1.03); background: linear-gradient(135deg, rgba(42,174,166,0.28), rgba(255,196,144,0.28)); border-color: rgba(255,196,144,0.32); box-shadow: 0 4px 16px rgba(42,174,166,0.2); }
        .skills-card, .music-card, .guest-card { transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease; }
        .skills-card:hover, .music-card:hover, .guest-card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.5); }
        .m-btn:hover { color:#ffc490; transform: scale(1.15); }
        .m-play { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .m-play:hover { transform: scale(1.08); box-shadow: 0 8px 24px rgba(42,174,166,0.45); }
        .m-play:active { transform: scale(0.96); }
        .g-btn { transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s; }
        .g-btn:hover { transform: translateY(-1px) scale(1.02); box-shadow: 0 6px 20px rgba(42,174,166,0.35); filter: brightness(1.05); }
        .g-note { transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }
        .g-note:hover { transform: translateY(-2px); border-color: rgba(255,196,144,0.22); box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
        .nav-dot:hover { background: rgba(255,255,255,0.45); transform: scale(1.2); }
        /* Scroll animations */
        .reveal { opacity:0; transform: translateY(28px) scale(0.98); transition: opacity 0.7s ease, transform 0.7s ease; }
        .reveal.active { opacity:1; transform: translateY(0) scale(1); }
        .reveal.delay-1 { transition-delay: 0.1s; }
        .reveal.delay-2 { transition-delay: 0.2s; }
        .reveal.delay-3 { transition-delay: 0.3s; }

        @media (max-width: 600px) {
            .name { font-size:52px; }
            .pfp-wrap { width:160px; height:160px; }
            .skills-grid { grid-template-columns:1fr; }
            .nav-dots { right:10px; }
        }
    </style>
</head>

    </section>

    <script>
        // Nav
        const secs=document.querySelectorAll('.section'), dots=document.querySelectorAll('.nav-dot');
        function scrollToSection(i){ secs[i].scrollIntoView({behavior:'smooth'}); }
        const obs=new IntersectionObserver(ents=>{ ents.forEach(e=>{ if(e.isIntersecting){ const idx=[...secs].indexOf(e.target); dots.forEach((d,i)=>d.classList.toggle('active',i===idx)); } }); },{threshold:0.5});
        secs.forEach(s=>obs.observe(s));

        // Music 4 tracks
        const tracks=[
            {src:"lex-amarni-the-kill.mp3", title:"the kill", artist:"lex amarni", art:"lex-amarni-the-kill.jpg"},
            {src:"clarion-hello-juliet.mp3", title:"hello juliet", artist:"clarion", art:"clarion-hello-juliet.jpg"},
            {src:"tomas-herudek-handwork.mp3", title:"handwork", artist:"tomas herudek", art:"tomas-herudek-handwork.jpg"},
            {src:"ophex-crush-on-you-hardtekk.mp3", title:"crush on you - hardtekk", artist:"ophex", art:"ophex-crush-on-you-hardtekk.jpg"}
        ];
        let cur=0; const audio=new Audio(tracks[0].src); audio.loop=true; audio.volume=0.75; audio.muted=true; audio.autoplay=true;
        const mArt=document.getElementById('mArt'), mTitle=document.getElementById('mTitle'), mArtist=document.getElementById('mArtist'), mPlay=document.getElementById('mPlay'), mFill=document.getElementById('mFill'), mBar=document.getElementById('mBar'), mCur=document.getElementById('mCur'), mDur=document.getElementById('mDur'), mVol=document.getElementById('mVol');
        let isPlaying=false, hasUnlocked=false, userPaused=false;
        function updPlay(){ const icon=document.getElementById('mPlayIcon'); if(!icon) return; icon.innerHTML=isPlaying?'<path d="M6 19h4V5H6zm8-14v14h4V5z"/>':'<path d="M8 5.2v13.6L19 12 8 5.2z"/>'; }
        audio.addEventListener('play',()=>{isPlaying=true; updPlay();});
        audio.addEventListener('pause',()=>{if(!audio.ended){isPlaying=false; updPlay();}});
        function tryMuted(){ audio.muted=true; audio.play().then(()=>{isPlaying=true;}).catch(()=>{}); }
        document.addEventListener('DOMContentLoaded', tryMuted); window.addEventListener('load', tryMuted); tryMuted();
        function unlock(){ if(hasUnlocked||userPaused) return; const v=parseInt(mVol.value||'75'); audio.volume=Math.max(0,Math.min(1,(v/100)**1.5)); if(isPlaying&&audio.muted){audio.muted=false; hasUnlocked=true; return;} audio.muted=false; audio.play().then(()=>{isPlaying=true; hasUnlocked=true; updPlay();}).catch(()=>{audio.muted=true; audio.play().catch(()=>{});}); }
        ['mousemove','mousedown','keydown','touchstart','wheel','scroll','pointermove','click'].forEach(ev=>window.addEventListener(ev, unlock, {passive:true}));
        function loadTrack(i){
            cur=(i+tracks.length)%tracks.length; const t=tracks[cur];
            audio.pause(); audio.src=t.src; audio.load(); audio.loop=true;
            mArt.src=t.art; mTitle.textContent=t.title; mArtist.textContent=t.artist;
            mFill.style.width='0%'; mCur.textContent='0:00'; mDur.textContent='0:00';
            isPlaying=false; userPaused=false; hasUnlocked=true; audio.muted=false;
            const v=parseInt(mVol.value||'75'); audio.volume=Math.max(0,Math.min(1,(v/100)**1.5));
            audio.play().then(()=>{isPlaying=true; updPlay();}).catch(()=>{});
        }
        document.getElementById('mPrev').onclick=()=>loadTrack(cur-1);
        document.getElementById('mNext').onclick=()=>loadTrack(cur+1);
        mPlay.onclick=()=>{
            if(isPlaying){ audio.pause(); isPlaying=false; userPaused=true; hasUnlocked=true; updPlay(); }
            else { userPaused=false; hasUnlocked=true; audio.muted=false; const v=parseInt(mVol.value||'75'); audio.volume=Math.max(0,Math.min(1,(v/100)**1.5)); audio.play().then(()=>{isPlaying=true; updPlay();}).catch(()=>{}); }
        };
        function fmt(s){ if(isNaN(s)) return '0:00'; const m=Math.floor(s/60), sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }
        audio.addEventListener('timeupdate',()=>{ if(audio.duration){ mFill.style.width=(audio.currentTime/audio.duration*100)+'%'; mCur.textContent=fmt(audio.currentTime); }});
        audio.addEventListener('loadedmetadata',()=>{ mDur.textContent=fmt(audio.duration); });
        mBar.onclick=(e)=>{ if(audio.duration){ const r=mBar.getBoundingClientRect(); audio.currentTime=(e.clientX-r.left)/r.width*audio.duration; } };
        mVol.oninput=()=>{ const v=parseInt(mVol.value); const cur=Math.max(0,Math.min(1,(v/100)**1.5)); audio.volume=cur; };

        // Views 1 per IP for Inningz (project: niningz)
        const VIEW_URL='https://niningz-default-rtdb.firebaseio.com/views.json';
        const VIEW_IPS='https://niningz-default-rtdb.firebaseio.com/viewIPs';
        const viewEl=document.getElementById('viewCount');
        (async()=>{
            try{
                const r=await fetch(VIEW_URL); let curVal=null; try{curVal=await r.json();}catch(e){}
                let count=(typeof curVal==='number')?curVal:(curVal!==null?parseInt(curVal)||0:0);
                if(curVal===null){ viewEl.textContent='0'; count=0; } else { viewEl.textContent=String(count); }
                let ip=null; try{const ipR=await fetch('https://api.ipify.org?format=json'); if(ipR.ok){const j=await ipR.json(); ip=j.ip;}}catch(e){}
                if(!ip) return;
                const key=ip.replace(/\./g,'_').replace(/:/g,'_');
                const ipUrl=`${VIEW_IPS}/${key}.json`;
                const c=await fetch(ipUrl); let ex=null; try{ex=await c.json();}catch(e){}
                if(ex) return;
                const nxt=count+1; viewEl.textContent=String(nxt);
                await fetch(VIEW_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(nxt)});
                await fetch(ipUrl,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(true)});
            }catch(e){ viewEl.textContent=viewEl.textContent||'0'; }
        })();

        // Guestbook for Inningz (project: niningz)
        const GB_URL='https://niningz-default-rtdb.firebaseio.com/notes.json';
        const gName=document.getElementById('gName'), gMsg=document.getElementById('gMsg'), gBtn=document.getElementById('gBtn'), gWall=document.getElementById('gWall'), gErr=document.getElementById('gErr'), gCount=document.getElementById('gCount');
        function censor(t){ return t.replace(/n+[i1!|]+g{2,}[a4@e3]*r*s*/gi, m=>'*'.repeat(m.length)); }
        function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        async function fetchNotes(){
            try{ const r=await fetch(GB_URL); if(!r.ok) return []; const raw=await r.json(); return raw?Object.entries(raw).map(([id,v])=>({id, ...v})) : []; }catch(e){return [];}
        }
        async function renderWall(){
            gWall.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;font-size:11px;color:rgba(255,255,255,0.3);">loading...</div>';
            const notes=await fetchNotes();
            gWall.innerHTML='';
            if(notes.length===0) return;
            const pinned=notes.filter(n=>!!n.pinned);
            const rest=notes.filter(n=>!n.pinned);
            const ordered=[...pinned, ...[...rest].reverse()];
            ordered.slice(0,12).forEach(n=>{
                const d=document.createElement('div'); d.className='g-note'+(n.pinned?' pinned':'');
                const time=n.time?new Date(n.time).toLocaleDateString():'';
                d.innerHTML=`<div class="g-note-name">${esc(n.name)}</div><div class="g-note-msg">${esc(n.msg)}</div><div class="g-note-time">${esc(time)}</div>`;
                gWall.appendChild(d);
            });
        }
        function updCount(){ const l=gMsg.value.length; gCount.textContent=l+' / 30'; }
        gMsg.addEventListener('input', updCount);
        async function postNote(){
            gErr.textContent='';
            let name=gName.value.trim(), msg=gMsg.value.trim();
            if(!name) return gErr.textContent='enter a name';
            if(name.length>16) return gErr.textContent='name max 16';
            if(!msg) return gErr.textContent='enter a note';
            if(msg.length>30) return gErr.textContent='30 max';
            gBtn.disabled=true; gBtn.textContent='...';
            const notes=await fetchNotes();
            if(notes.some(n=>n.name.toLowerCase()===name.toLowerCase())){ gErr.textContent='name taken'; gBtn.disabled=false; gBtn.textContent='post'; return; }
            name=censor(name); msg=censor(msg);
            const payload={name, msg, time:Date.now(), pinned:false};
            try{ const res=await fetch(GB_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); if(!res.ok) throw new Error(); }catch(e){ gErr.textContent='failed'; gBtn.disabled=false; gBtn.textContent='post'; return; }
            gMsg.value=''; updCount(); await renderWall(); gErr.style.color='#ffc490'; gErr.textContent='posted'; setTimeout(()=>{gErr.textContent=''; gErr.style.color='#ff8a8a';},1500); gBtn.disabled=false; gBtn.textContent='post';
        }
        gBtn.onclick=postNote;
        gMsg.onkeydown=e=>{ if(e.key==='Enter') postNote(); };
        gName.onkeydown=e=>{ if(e.key==='Enter') gMsg.focus(); };
        renderWall(); updCount();

        // Scroll reveal
        const reveals = document.querySelectorAll('.reveal');
        const revealObs = new IntersectionObserver((ents)=>{ ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('active'); revealObs.unobserve(e.target); } }); }, {threshold:0.15});
        reveals.forEach(r=> revealObs.observe(r));
        setTimeout(()=>{ document.querySelectorAll('#sec0 .reveal').forEach(el=>el.classList.add('active')); }, 120);
    </script>
</body>
</html>
